[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tick-tock"
version = "0.1.0"
description = "Personal time tracking desktop application for Windows"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[project.scripts]
tick-tock = "src.main:main"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: integration tests across multiple real components",
    "qualification: qualification/acceptance tests for end-user scenarios",
    "design_validation: design validation tests for architecture constraints",
    "gui: tests that use a real Tk GUI runtime and may create windows",
]

  [tool.pylint.format]
  # Keep line-length enforcement from pylint defaults; only raise module-length
  # limit to match existing large UI modules while preserving all other checks.
  max-module-lines = 3000
